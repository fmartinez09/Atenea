[package]
name = "atenea-clip"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
atenea-core = { path = "../atenea-core" }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
